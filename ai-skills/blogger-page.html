<meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
#sk{--ink:#17142e;--mu:#6a6785;--vi:#6b3df0;--vi2:#4b25c4;--mist:#efeaff;--paper:#fbfaff;--ln:#e3def5;--am:#f5a524;font-family:'Readex Pro',Tahoma,Arial,sans-serif;color:var(--ink);direction:rtl;text-align:right;line-height:1.75;background:var(--paper);border-radius:26px;overflow:hidden;max-width:1180px;margin:0 auto;font-size:15px}
#sk *{box-sizing:border-box}
#sk a{color:inherit;text-decoration:none}
#sk button{font:inherit;color:inherit;cursor:pointer}
#sk svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#sk :focus-visible{outline:3px solid var(--vi);outline-offset:2px;border-radius:8px}
/* رأس الصفحة */
#sk .top{background:var(--ink);color:#fff;padding:44px 40px 36px;position:relative;overflow:hidden}
#sk .top:before{content:"";position:absolute;inset-inline-start:-80px;top:-120px;width:420px;height:420px;border-radius:50%;border:64px solid rgba(107,61,240,.35)}
#sk .top:after{content:"";position:absolute;inset-inline-start:120px;bottom:-150px;width:260px;height:260px;border-radius:50%;background:rgba(245,165,36,.16)}
#sk .top>*{position:relative;z-index:1;max-width:640px}
#sk h1{font-family:'Reem Kufi','Readex Pro',sans-serif;font-weight:700;font-size:clamp(34px,6vw,58px);line-height:1.2;margin:0 0 12px;letter-spacing:0}
#sk .sub{margin:0 0 22px;color:#cdc7ee;font-size:16px;max-width:520px}
#sk .find{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:6px 16px}
#sk .find svg{color:var(--vi);font-size:20px}
#sk .find input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:12px 0;min-width:0}
#sk .find input:focus{outline:none}
#sk .find:focus-within{box-shadow:0 0 0 3px var(--vi)}
#sk .nums{display:flex;gap:22px;margin-top:18px;color:#cdc7ee;font-size:14px;flex-wrap:wrap}
#sk .nums b{color:#fff;font-size:20px;font-weight:600;margin-inline-end:5px}
/* هيكل الصفحة */
#sk .shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:34px;padding:30px 40px 40px;align-items:start}
#sk .side{position:sticky;top:12px;min-width:0}
#sk main,#sk .shell>div{min-width:0}
#sk .side h2{font-size:13px;color:var(--mu);font-weight:500;margin:0 0 8px}
#sk .cats{display:flex;flex-direction:column;gap:2px}
#sk .cat{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:0;padding:8px 10px;border-radius:12px;font-size:14.5px;transition:background .15s}
#sk .cat:hover{background:var(--mist)}
#sk .cat.on{background:var(--ink);color:#fff}
#sk .cat i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
#sk .cat small{margin-inline-start:auto;opacity:.6;font-size:12.5px}
#sk .side select{width:100%;margin-top:14px;font:inherit;font-size:14px;border:1px solid var(--ln);border-radius:12px;padding:9px 10px;background:#fff;color:var(--ink)}
#sk .side .lbl{margin-top:16px}
/* الشارة المولّدة */
#sk .bdg{flex-shrink:0;border-radius:16px;display:block}
/* الأفضل */
#sk .best{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:34px}
#sk .bc{display:flex;flex-direction:column;gap:10px;background:var(--mist);border-radius:22px;padding:18px;cursor:pointer;transition:transform .2s,box-shadow .2s;min-height:230px}
#sk .bc:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(75,37,196,.16)}
#sk .bc h3{font-family:'Reem Kufi','Readex Pro',sans-serif;font-size:22px;line-height:1.35;margin:4px 0 0}
#sk .bc p{margin:0;color:#4c4968;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#sk .bc .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mu)}
#sk .hd{display:flex;align-items:baseline;gap:10px;margin:0 0 6px;padding-top:6px}
#sk .hd h2{font-family:'Reem Kufi','Readex Pro',sans-serif;font-size:26px;margin:0}
#sk .hd span{color:var(--mu);font-size:14px}
/* الصفوف */
#sk .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:16px 8px;border-bottom:1px solid var(--ln);cursor:pointer;border-radius:14px;transition:background .15s}
#sk .row:hover{background:var(--mist)}
#sk .row h3{margin:0;font-size:17.5px;font-weight:600;line-height:1.5}
#sk .row .en{display:block;font-size:12.5px;color:var(--mu);direction:ltr;text-align:right;font-weight:400;line-height:1.4}
#sk .row p{margin:2px 0 0;color:#4c4968;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sk .row .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mu)}
#sk .row .tg span{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:0 9px}
#sk .row .tg .auto{border-color:#f4c27a;color:#9a5b00}
#sk .qk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:#fff;border-radius:12px;padding:7px 14px;font-size:13.5px;font-weight:500;white-space:nowrap}
#sk .qk:hover{background:var(--vi);border-color:var(--vi);color:#fff}
#sk .qk:disabled{opacity:.6;cursor:wait}
#sk .rt{display:flex;gap:2px;direction:ltr}
#sk .rt i{width:6px;height:18px;border-radius:3px;background:#ddd7f2}
#sk .rt i.on{background:var(--am)}
#sk .more{display:block;margin:22px auto 0;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:11px 30px;font-weight:500}
#sk .empty{padding:34px;text-align:center;color:var(--mu);border:1px dashed var(--ln);border-radius:18px;margin-top:14px}
#sk .empty button{margin-top:10px;background:var(--vi);color:#fff;border:0;border-radius:12px;padding:8px 20px}
#sk .sk{height:74px;border-radius:14px;margin:10px 0;background:linear-gradient(90deg,#efeaff 25%,#f8f5ff 50%,#efeaff 75%);background-size:200% 100%;animation:sks 1.3s infinite}
@keyframes sks{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){#sk *{animation:none!important;transition:none!important}}
/* التفاصيل */
#sk .crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu);margin-bottom:18px}
#sk .crumb button{background:none;border:0;padding:0;color:var(--vi);font-weight:500}
#sk .dh{display:flex;gap:20px;align-items:center;margin-bottom:24px}
#sk .dh h1{font-size:clamp(28px,4.5vw,42px);color:var(--ink);margin:0}
#sk .dh .en{direction:ltr;text-align:right;color:var(--mu);font-size:14px}
#sk .dg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start}
#sk .dg h2{font-family:'Reem Kufi','Readex Pro',sans-serif;font-size:21px;margin:26px 0 8px}
#sk .dg h2:first-child{margin-top:0}
#sk .dg p{margin:0 0 8px;max-width:68ch}
#sk .when{background:var(--mist);border-radius:16px;padding:14px 18px;max-width:68ch}
#sk .md{width:100%;max-height:420px;border-radius:18px;background:#000;display:block;margin-bottom:22px;object-fit:contain}
#sk .panel{position:sticky;top:12px;background:var(--ink);color:#fff;border-radius:22px;padding:22px}
#sk .dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--am);color:var(--ink);border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:600}
#sk .dl:disabled{opacity:.7;cursor:wait}
#sk .gh{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:10px;font-size:14px}
#sk .msg{font-size:13px;color:#cdc7ee;margin-top:10px;min-height:20px}
#sk .msg a{color:var(--am);text-decoration:underline}
#sk dl{margin:16px 0 0;display:grid;gap:10px;font-size:13.5px}
#sk dl div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.14);padding-top:9px}
#sk dt{color:#b9b2e0}
#sk dd{margin:0;font-weight:500;direction:ltr}
#sk .steps{padding-inline-start:20px;margin:0;max-width:68ch}
#sk .steps li{margin-bottom:6px}
#sk code{background:var(--mist);border-radius:6px;padding:0 6px;font-size:13px;direction:ltr;display:inline-block}
#sk .fl{direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:12.5px;max-height:210px;overflow:auto;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 14px}
#sk .note{font-size:12.5px;color:var(--mu);margin-top:26px}
#sks-seo{max-width:1180px;margin:20px auto 0;padding:0 10px;color:#3d3963;font-size:14.5px;line-height:1.9;direction:rtl;text-align:right;font-family:'Readex Pro',Tahoma,Arial,sans-serif}
#sks-seo h3{font-size:16px;margin:12px 0 2px}
@media(max-width:860px){
 #sk .shell{grid-template-columns:minmax(0,1fr);padding:18px 16px 28px;gap:14px}
 #sk .side{position:static}
 #sk .cats{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:thin}
 #sk .cat{width:auto;white-space:nowrap;border:1px solid var(--ln);background:#fff;padding:6px 12px}
 #sk .cat.on{border-color:var(--ink)}
 #sk .side h2.lbl,#sk .side .fx{display:none}
 #sk .top{padding:30px 20px 26px}
 #sk .best{grid-template-columns:1fr}
 #sk .bc{min-height:0}
 #sk .row{grid-template-columns:auto minmax(0,1fr);gap:12px}
 #sk .row .rt,#sk .row .qk{display:none}
 #sk .dg{grid-template-columns:minmax(0,1fr)}
 #sk .panel{position:static;order:-1}
}
</style>

<div id="sk"><div id="sk-root"><div class="top"><h1>مكتبة المهارات</h1></div><div class="shell"><div></div><div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div></div></div>
<noscript><p dir="rtl" style="text-align:center">فعّل JavaScript لعرض المهارات.</p></noscript>
<div id="sks-seo" lang="ar" dir="rtl"><div id="sk-index"></div></div>
<script type="application/ld+json" id="sk-ld"></script>

<script>//<![CDATA[
(function(){
var SRC=["https://ahmedmher.github.io/monsinfopubilc/ai-skills/","https://raw.githubusercontent.com/ahmedmher/monsinfopubilc/main/ai-skills/"];
var SITE="مكتبة المهارات (Skills) للذكاء الاصطناعي بالعربي",T0=document.title;
var root=document.getElementById("sk-root"),D=null,q="",cat="all",srt="best",src="all",lim=20;
/* ألوان التصنيفات: [خلفية الشارة، لون أول، لون ثانٍ] */
var PAL={dev:["#1f2a6b","#7aa2ff","#c7d6ff"],docs:["#0f4c5c","#5fd0c5","#d3f5ef"],design:["#5b1f4f","#ff8fc7","#ffd3ea"],content:["#14532d","#7be0a0","#d4f7e0"],media:["#7f1d1d","#ff9a8a","#ffd9d1"],data:["#134e4a","#6ee7d0","#d1faf1"],automation:["#3b1f7a","#b79bff","#e4d9ff"],research:["#7c2d12","#ffb36b","#ffe2c4"],marketing:["#831843","#ff7a9c","#ffd1dc"],business:["#365314","#bde36a","#eaf8c4"],quality:["#1e293b","#8fb3d9","#d6e4f3"],ai:["#0c4a6e","#6cc3ff","#cdeaff"],other:["#44337a","#d0b8ff","#efe6ff"]};
var SVGI={dl:'<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg>',ar:'<svg viewBox="0 0 24 24"><path d="M19 12H5m7 7-7-7 7-7"/></svg>',se:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',gh:'<svg viewBox="0 0 24 24"><path d="M7 7h10v10M7 17 17 7"/></svg>'};
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML.replace(/"/g,"&quot;")}
function safe(u){return /^https:\/\//i.test(u||"")?u:""}
function title(s){return s.title_ar||s.name}
function desc(s){return s.desc_ar||s.desc_main||s.desc_en||""}
function catLabel(id){var c=D.categories.filter(function(x){return x.id===id})[0];return c?c.label:"أخرى"}
function gh(s){return "https://github.com/"+s.repo+(s.path?"/tree/"+s.branch+"/"+s.path:"")}
function pageUrl(){return location.origin+location.pathname}
function hash(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
/* شارة فريدة لكل skill: شكل هندسي يولّده اسمها */
function badge(s,sz){
  var p=PAL[s.cat]||PAL.other,h=hash(s.name),r=function(n){h=Math.imul(h^(h>>>15),2246822507)>>>0;return h%n};
  var shapes="",i,k;
  for(i=0;i<3;i++){
    k=r(4);var x=8+r(48),y=8+r(48),c=i===2?p[2]:p[1],z=10+r(18);
    if(k===0)shapes+='<circle cx="'+x+'" cy="'+y+'" r="'+z/2+'" fill="'+c+'"/>';
    else if(k===1)shapes+='<rect x="'+(x-z/2)+'" y="'+(y-z/2)+'" width="'+z+'" height="'+z+'" rx="3" fill="'+c+'" transform="rotate('+r(90)+' '+x+' '+y+')"/>';
    else if(k===2)shapes+='<path d="M'+(x-z)+' '+y+'a'+z+' '+z+' 0 0 1 '+z*2+' 0" fill="none" stroke="'+c+'" stroke-width="'+(4+r(4))+'" stroke-linecap="round"/>';
    else shapes+='<path d="M'+x+' '+(y-z/2)+'l'+z/2+' '+z+'h-'+z+'z" fill="'+c+'"/>';
  }
  return '<svg class="bdg" viewBox="0 0 64 64" role="img" aria-label="'+esc(title(s))+'" style="width:'+sz+'px;height:'+sz+'px;background:'+p[0]+'">'+shapes+'</svg>';
}
function meter(n){var h="";for(var i=1;i<=5;i++)h+='<i'+(i<=n?' class="on"':'')+'></i>';return '<span class="rt" title="تقييم الجودة '+n+' من 5" aria-label="تقييم الجودة '+n+' من 5">'+h+'</span>'}

function seoIndex(){var el=document.getElementById("sk-index");if(el)el.innerHTML="<h2>فهرس المهارات</h2>"+D.skills.map(function(s){return "<h3>"+esc(title(s))+"</h3><p>"+esc(s.desc_ar||"")+"</p>"}).join("")}
function jsonld(){var s=document.getElementById("sk-ld");if(!s)return;s.textContent=JSON.stringify({"@context":"https://schema.org","@type":"CollectionPage","name":SITE,"inLanguage":"ar","url":pageUrl(),"mainEntity":{"@type":"ItemList","numberOfItems":D.skills.length,"itemListElement":D.skills.slice(0,100).map(function(x,i){return {"@type":"ListItem","position":i+1,"name":title(x),"url":pageUrl()+"#sk/"+x.id}})}}).replace(/<\//g,"<\\/")}

function row(s){
  return '<div class="row" tabindex="0" role="link" data-id="'+esc(s.id)+'">'+badge(s,60)+
   '<div><h3>'+esc(title(s))+'<span class="en">'+esc(s.name)+'</span></h3><p>'+esc(desc(s))+'</p><div class="tg"><span>'+esc(catLabel(s.cat))+'</span>'+(s.curated?'':'<span class="auto">ترجمة آلية</span>')+(s.media?'<span>'+(s.media.type==="video"?"فيديو":"صورة")+'</span>':'')+'<span style="direction:ltr">'+esc(s.repo.split("/")[0])+'</span></div></div>'+
   meter(s.rating)+'<button class="qk" data-dl="'+esc(s.id)+'">'+SVGI.dl+' تحميل</button></div>';
}
function best(s){
  return '<div class="bc" tabindex="0" role="link" data-id="'+esc(s.id)+'">'+badge(s,72)+'<h3>'+esc(title(s))+'</h3><p>'+esc(desc(s))+'</p><div class="ft"><span>'+esc(catLabel(s.cat))+'</span>'+meter(s.rating)+'</div></div>';
}

function home(){
  document.title=T0;
  var qq=q.trim().toLowerCase();
  var list=D.skills.filter(function(s){
    if(cat!=="all"&&s.cat!==cat)return false;
    if(src!=="all"&&s.repo.split("/")[0]!==src)return false;
    if(!qq)return true;
    return (s.name+" "+(s.title_ar||"")+" "+(s.desc_ar||"")+" "+(s.desc_en||"")).toLowerCase().indexOf(qq)>-1;
  });
  if(srt==="stars")list=list.slice().sort(function(a,b){return b.stars-a.stars});else if(srt==="name")list=list.slice().sort(function(a,b){return title(a).localeCompare(title(b),"ar")});
  var counts={},owners={};D.skills.forEach(function(s){counts[s.cat]=(counts[s.cat]||0)+1;var o=s.repo.split("/")[0];owners[o]=(owners[o]||0)+1});
  var showBest=!qq&&cat==="all"&&src==="all"&&srt==="best";
  var h='<div class="top"><h1>مكتبة المهارات</h1><p class="sub">skills جاهزة لـ Claude وأدوات الذكاء الاصطناعي. شرح عربي واضح، وتحميل مباشر من GitHub.</p>'+
   '<label class="find">'+SVGI.se+'<input id="sk-q" type="search" aria-label="بحث" placeholder="ابحث: تسويق، pdf، اختبار، تصميم..." value="'+esc(q)+'"></label>'+
   '<div class="nums"><span><b>'+D.skills.length+'</b>مهارة</span><span><b>'+Object.keys(counts).length+'</b>تصنيفًا</span><span><b>'+Object.keys(owners).length+'</b>مصدرًا</span></div></div>'+
   '<div class="shell"><aside class="side"><h2 class="lbl">التصنيفات</h2><div class="cats"><button class="cat'+(cat==="all"?" on":"")+'" data-c="all">الكل<small>'+D.skills.length+'</small></button>'+
   D.categories.filter(function(c){return counts[c.id]}).map(function(c){return '<button class="cat'+(cat===c.id?" on":"")+'" data-c="'+c.id+'"><i style="background:'+(PAL[c.id]||PAL.other)[1]+'"></i>'+esc(c.label)+'<small>'+counts[c.id]+'</small></button>'}).join("")+'</div>'+
   '<h2 class="lbl fx">المصدر</h2><select class="fx" id="sk-src" aria-label="المصدر"><option value="all">كل المصادر</option>'+Object.keys(owners).sort().map(function(o){return '<option value="'+esc(o)+'"'+(src===o?" selected":"")+'>'+esc(o)+' ('+owners[o]+')</option>'}).join("")+'</select>'+
   '<h2 class="lbl fx">الترتيب</h2><select class="fx" id="sk-s" aria-label="الترتيب"><option value="best"'+(srt==="best"?" selected":"")+'>الأعلى تقييمًا</option><option value="stars"'+(srt==="stars"?" selected":"")+'>الأشهر على GitHub</option><option value="name"'+(srt==="name"?" selected":"")+'>أبجديًا</option></select></aside><main>';
  if(showBest)h+='<div class="hd"><h2>الأعلى تقييمًا</h2></div><div class="best">'+D.skills.slice(0,3).map(best).join("")+'</div>';
  h+='<div class="hd"><h2>'+(cat==="all"?"كل المهارات":esc(catLabel(cat)))+'</h2><span>'+list.length+' نتيجة</span></div>';
  if(!list.length)h+='<div class="empty">لا توجد مهارة تطابق بحثك.<br><button id="sk-clr">مسح البحث والفلاتر</button></div>';
  else h+=list.slice(0,lim).map(row).join("")+(list.length>lim?'<button class="more" id="sk-more">عرض '+Math.min(20,list.length-lim)+' مهارة أخرى</button>':'');
  root.innerHTML=h+'<p class="note">آخر تحديث: '+esc(D.updated)+'. القائمة تتحدّث تلقائيًا من GitHub.</p></main></div>';
  var inp=document.getElementById("sk-q");
  inp.oninput=function(){q=inp.value;lim=20;var p=inp.selectionStart;home();var n=document.getElementById("sk-q");n.focus();n.setSelectionRange(p,p)};
  document.getElementById("sk-s").onchange=function(){srt=this.value;lim=20;home()};
  document.getElementById("sk-src").onchange=function(){src=this.value;lim=20;home()};
  var c=document.getElementById("sk-clr");if(c)c.onclick=function(){q="";cat="all";src="all";srt="best";lim=20;home()};
  var m=document.getElementById("sk-more");if(m)m.onclick=function(){lim+=20;home()};
  root.querySelectorAll(".cat").forEach(function(el){el.onclick=function(){cat=el.dataset.c;lim=20;home()}});
  root.querySelectorAll("[data-id]").forEach(function(el){el.onclick=function(e){if(e.target.closest("[data-dl]"))return;location.hash="sk/"+el.dataset.id};el.onkeydown=function(e){if(e.key==="Enter")location.hash="sk/"+el.dataset.id}});
  root.querySelectorAll("[data-dl]").forEach(function(b){b.onclick=function(e){e.stopPropagation();var s=D.skills.filter(function(x){return x.id===b.dataset.dl})[0];download(s,b,null)}});
}

function mediaHtml(s){
  var m=s.media;if(!m||!safe(m.url))return "";
  return m.type==="video"?'<video class="md" controls preload="metadata" playsinline src="'+esc(m.url)+'"></video>':'<img class="md" src="'+esc(m.url)+'" alt="'+esc(title(s))+'" onerror="this.remove()">';
}
function detail(s){
  document.title=title(s)+" | "+SITE;
  var rel=D.skills.filter(function(x){return x.cat===s.cat&&x.id!==s.id}).slice(0,4);
  var strip=s.path?s.path.length+1:0;
  var h='<div class="shell" style="grid-template-columns:1fr;padding-top:26px"><div><div class="crumb"><button id="sk-back">'+SVGI.ar+' كل المهارات</button><span>/</span><span>'+esc(catLabel(s.cat))+'</span></div>'+
   '<div class="dh">'+badge(s,92)+'<div><h1>'+esc(title(s))+'</h1><div class="en">'+esc(s.name)+'</div></div></div>'+
   '<div class="dg"><div>'+mediaHtml(s)+'<h2>ما هذه المهارة؟</h2><p>'+esc(desc(s)||"لا يوجد وصف.")+'</p>'+
   (s.desc_ar&&s.desc_en?'<details><summary style="cursor:pointer;color:var(--mu);font-size:13.5px">الوصف الأصلي بالإنجليزية</summary><p style="direction:ltr;text-align:left;color:var(--mu);font-size:13.5px">'+esc(s.desc_en)+'</p></details>':'')+
   (s.when_ar||s.when_en?'<h2>متى تستخدمها؟</h2><div class="when">'+esc(s.when_ar||s.when_en)+'</div>':'')+
   '<h2>طريقة الاستخدام</h2><ol class="steps"><li>اضغط «تحميل» لتحصل على ملف ZIP، وفكّ ضغطه.</li><li>في Claude: الإعدادات، ثم Capabilities، ثم Skills، وارفع الملف.</li><li>في Claude Code: انقل المجلد إلى <code>~/.claude/skills/</code> وأعد تشغيل الجلسة.</li></ol>'+
   (s.files.length?'<h2>محتويات المهارة ('+s.files.length+' ملف)</h2><div class="fl">'+s.files.map(function(f){return esc(f.slice(strip))}).join("<br>")+'</div>':'')+
   (s.repo_media&&safe(s.repo_media.url)?'<h2>من مستودع المصدر</h2>'+(s.repo_media.type==="video"?'<video class="md" controls preload="metadata" playsinline src="'+esc(s.repo_media.url)+'"></video>':'<img class="md" src="'+esc(s.repo_media.url)+'" alt="'+esc(s.repo)+'" onerror="this.remove()">'):'')+
   '<p class="note">الملفات تُحمَّل مباشرة من مستودع المؤلف وتخضع لرخصته. راجع الرخصة قبل إعادة التوزيع.</p></div>'+
   '<aside class="panel"><button class="dl" id="sk-dl">'+SVGI.dl+' تحميل المهارة</button><a class="gh" href="'+esc(gh(s))+'" target="_blank" rel="noopener">فتح على GitHub '+SVGI.gh+'</a><div class="msg" id="sk-msg" role="status"></div>'+
   '<dl><div><dt>التقييم</dt><dd>'+meter(s.rating)+'</dd></div><div><dt>المصدر</dt><dd>'+esc(s.repo)+'</dd></div>'+(s.stars?'<div><dt>نجوم المستودع</dt><dd>'+s.stars.toLocaleString("en")+'</dd></div>':'')+(s.license?'<div><dt>الرخصة</dt><dd>'+esc(s.license)+'</dd></div>':'')+'<div><dt>الملفات</dt><dd>'+(s.files.length||"—")+'</dd></div></dl></aside></div>'+
   (rel.length?'<div class="hd" style="margin-top:34px"><h2>مهارات مشابهة</h2></div>'+rel.map(row).join(""):'')+'</div></div>';
  root.innerHTML=h;
  document.getElementById("sk-back").onclick=function(){location.hash=""};
  document.getElementById("sk-dl").onclick=function(){download(s,document.getElementById("sk-dl"),document.getElementById("sk-msg"))};
  root.querySelectorAll(".row").forEach(function(el){el.onclick=function(e){if(e.target.closest("[data-dl]"))return;location.hash="sk/"+el.dataset.id}});
  root.querySelectorAll("[data-dl]").forEach(function(b){b.onclick=function(e){e.stopPropagation();download(D.skills.filter(function(x){return x.id===b.dataset.dl})[0],b,null)}});
  try{document.getElementById("sk").scrollIntoView({block:"start"})}catch(e){}
}

function loadZip(){return new Promise(function(res,rej){if(window.JSZip)return res();var sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
function download(s,btn,msg){
  var old=btn.innerHTML;
  function say(t,html){if(msg){if(html)msg.innerHTML=t;else msg.textContent=t}else if(!html)btn.textContent=t}
  if(!s.files.length){if(msg)say('المهارة كبيرة للتحميل المباشر. <a href="'+esc(gh(s))+'" target="_blank" rel="noopener">افتحها على GitHub</a> وحمّلها من هناك.',true);else window.open(gh(s),"_blank");return}
  btn.disabled=true;say("جارٍ التجهيز...");
  var r0=s.path?s.path.length+1:0,folder=(s.path?s.path.split("/").pop():s.name)||s.name,done=0;
  loadZip().then(function(){
    var z=new JSZip();
    return Promise.all(s.files.map(function(f){return fetch("https://raw.githubusercontent.com/"+s.repo+"/"+s.branch+"/"+f.split("/").map(encodeURIComponent).join("/")).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(b){z.file(folder+"/"+f.slice(r0),b);done++;say(done+" من "+s.files.length)})})).then(function(){return z.generateAsync({type:"blob"})});
  }).then(function(blob){
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=folder+".zip";document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
    if(msg)say("تم التحميل: "+folder+".zip");else btn.textContent="تم ✓";
    setTimeout(function(){btn.innerHTML=old;btn.disabled=false},2500);
  }).catch(function(){
    if(msg)say('تعذّر التحميل المباشر. <a href="'+esc(gh(s))+'" target="_blank" rel="noopener">حمّلها من GitHub</a>.',true);else{btn.innerHTML=old;window.open(gh(s),"_blank")}
    btn.disabled=false;
  });
}

function route(){var m=location.hash.match(/^#sk\/(.+)$/),s=m&&D.skills.filter(function(x){return x.id===decodeURIComponent(m[1])})[0];s?detail(s):home()}
function load(i){
  if(i>=SRC.length){root.innerHTML='<div class="shell" style="grid-template-columns:1fr"><div class="empty">تعذّر جلب المهارات الآن. حاول مرة أخرى بعد قليل.</div></div>';return}
  fetch(SRC[i]+"skills.json?v="+Math.floor(Date.now()/600000)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){D=d;seoIndex();jsonld();window.addEventListener("hashchange",route);route()}).catch(function(){load(i+1)});
}
load(0);
})();
