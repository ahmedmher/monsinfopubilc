name: Telegram subscribers
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: telegram-subs
  cancel-in-progress: false
jobs:
  subs:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Handle /start and /stop, welcome new subscribers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 ai-news/telegram_news.py --subs --duration 780
      - name: Commit subscriber list (encrypted) if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          for f in ai-news/telegram-subs.dat ai-news/telegram-videos.json; do if [ -f $f ]; then git add $f; fi; done
          git diff --cached --quiet || (git commit -m "chore: update Telegram subscribers" && for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done)
      - name: Start the next polling run right away (no gap for new subscribers)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/telegram-subscribers.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}' || true
