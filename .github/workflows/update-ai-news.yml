name: Update AI news
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest main, not the commit that existed when this run was queued (a queued run used to start from stale state and re-send news)
      - name: Fetch RSS feeds
        run: python3 ai-news/update_news.py
      - name: Track models from rumour to release
        run: python3 ai-news/track_models.py
      - name: Telegram alerts, 6-hour top stories and daily digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OLD_TELEGRAM_BOT_TOKEN: ${{ secrets.OLD_TELEGRAM_BOT_TOKEN }}
          ALLOW_RESET_SUBSCRIBERS: ${{ secrets.ALLOW_RESET_SUBSCRIBERS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 ai-news/telegram_news.py
      - name: Save the Telegram state right away (so a later failure can never cause a re-send)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          if [ -f ai-news/telegram-state.json ]; then git add ai-news/telegram-state.json; fi
          git diff --cached --quiet || { git commit -m "chore: telegram state"; ok=0; for i in 1 2 3 4 5; do if git pull --rebase origin main && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 5; done; [ "$ok" = 1 ] || { echo "push failed"; exit 1; }; }
      - name: Build today summary and static pages
        run: python3 ai-news/build_today.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add ai-news/news.json ai-news/model-tracker.json ai-news/today.json ai-news/ar-cache.json docs
          for f in ai-news/telegram-state.json; do if [ -f $f ]; then git add $f; fi; done
          git diff --cached --quiet || { git commit -m "chore: update AI news"; ok=0; for i in 1 2 3 4 5; do if git pull --rebase origin main && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 5; done; [ "$ok" = 1 ] || { echo "push failed"; exit 1; }; }
