name: Update API prices
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh prices.json from the LiteLLM price list
        run: python3 api-cost-calculator/update_prices.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add api-cost-calculator/prices.json
          git diff --cached --quiet || (git commit -m "chore: update API prices" && for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done)
