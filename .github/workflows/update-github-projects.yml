name: Update GitHub projects board
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch top repos per topic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 github-projects/update_projects.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add github-projects/projects.json github-projects/details.json
          git diff --cached --quiet || (git commit -m "chore: update GitHub projects" && for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done)
