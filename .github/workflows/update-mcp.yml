name: Update MCP directory
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect MCP servers from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 mcp/update_mcp.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add mcp/servers.json mcp/servers-hist.json mcp/ar-cache.json
          git diff --cached --quiet || (git commit -m "chore: update MCP directory" && for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done)
