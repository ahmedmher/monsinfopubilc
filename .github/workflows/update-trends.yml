name: Update YouTube search trends
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch YouTube search suggestions
        run: python3 trends/update_trends.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add trends/trends.json
          git diff --cached --quiet || (git commit -m "chore: update YouTube trends" && for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done)
